name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main  # Auto-deploy when code is merged to main
  workflow_dispatch:  # Allows manual deployment from GitHub UI

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # actions/checkout wipes untracked/gitignored files (git clean -ffdx)
      # before checking out, so anything the running container wrote to
      # .env or settings.json since the last deploy (OAuth refresh tokens,
      # admin-edited settings) needs to be synced out to $HOME first, or
      # it's lost the moment checkout runs.
      - name: Back up live runtime state before checkout wipes it
        run: |
          [ -f .env ] && cp .env $HOME/env-dashboard
          [ -f data/settings.json ] && cp data/settings.json $HOME/settings-dashboard.json
          true

      - name: Checkout code
        uses:  actions/checkout@v4

      - name: Restore .env file
        run: cp $HOME/env-dashboard .env

      - name: Restore init-payload.json file
        run: cp $HOME/init-payload.json init-payload.json

      - name: Restore settings.json file
        run: cp $HOME/settings-dashboard.json data/settings.json 2>/dev/null || echo "{}" > data/settings.json

      # - name:  Run tests
      #   run: npm ci && npm test
      #   continue-on-error:  true  # Don't fail deployment if tests fail

      - name: Build and start container
        run: docker compose up -d --build

      - name: Wait for app to start
        run: sleep 5

      - name: Check container status
        run: |
          docker compose ps
          docker compose logs --tail=50
