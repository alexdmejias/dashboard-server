name: Build and Push Image

on:
  # Runs after the Release workflow finishes on main, rather than directly
  # on push, so the image always builds from a tree where semantic-release's
  # version-bump commit (package.json/CHANGELOG.md) has already landed —
  # otherwise the image would ship with a stale pre-bump version.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:  # Allows manual runs from GitHub UI

permissions:
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    strategy:
      matrix:
        include:
          # Self-contained image with puppeteer + system Chromium.
          - include-puppeteer: with-puppeteer
            tag: latest
          # Slimmer image (~700MB smaller) for deployments using an external
          # renderer only (cloudflare/browserless) — see Dockerfile.
          - include-puppeteer: without-puppeteer
            tag: slim

    steps:
      # No `ref` override: for a workflow_run trigger this defaults to main's
      # current HEAD, which already includes the Release workflow's
      # version-bump commit (if one was made).
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-building linux/arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            INCLUDE_PUPPETEER=${{ matrix.include-puppeteer }}
          tags: ghcr.io/alexdmejias/dashboard-server:${{ matrix.tag }}
          # Scoped per matrix leg since the two legs build in parallel and
          # share a GHA cache backend — see
          # https://docs.docker.com/build/cache/backends/gha/#scope
          cache-from: type=gha,scope=${{ matrix.include-puppeteer }}
          cache-to: type=gha,mode=max,scope=${{ matrix.include-puppeteer }}
