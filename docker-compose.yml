services:
  dashboard-server:
    # No build: here on purpose — this image is built and pushed to GHCR by
    # .github/workflows/build-and-push.yml on every push to main (GitHub's
    # runners cross-build for linux/arm64 via QEMU, much faster than building
    # on the Pi itself). Portainer/compose just pulls this tag; it should
    # never build from source on the deploy host. To build locally for dev,
    # run `docker build .` directly rather than adding build: back here.
    #
    # IMAGE_TAG picks which of the two tags that workflow publishes to pull:
    # "latest" (default, self-contained with puppeteer/Chromium) or "slim"
    # (~700MB smaller, requires browserRenderer set to cloudflare/browserless
    # in settings since it has no puppeteer). Set IMAGE_TAG=slim as a stack
    # environment variable in Portainer to switch — no file edit needed.
    image: ghcr.io/alexdmejias/dashboard-server:${IMAGE_TAG:-latest}
    # Always check the registry for a newer digest under this tag before
    # starting — without this, compose reuses whatever image is already
    # cached locally even after a new build has been pushed under the same
    # :latest/:slim tag (this bit us: a fixed image sat unused on the Pi for
    # hours because the old one was never re-pulled).
    pull_policy: always
    container_name: dashboard-server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # Docker's default json-file driver never rotates on its own, so a
        # crash-loop (as seen during the init-payload.json incident) can
        # otherwise fill the Pi's disk with log data.
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-3333}:${PORT:-3333}"
    environment:
      # lowdb writes settings.json via a temp-file + rename; that rename
      # fails with EBUSY if the target path is itself a bind-mount point,
      # so it lives inside the data/ directory mount instead of being its
      # own single-file mount.
      - SETTINGS_FILE=/app/data/settings.json
      # Explicit so it doesn't depend on the app's CWD-relative default
      # ("./init-payload.json") matching this container's WORKDIR — same
      # reasoning as SETTINGS_FILE above.
      - INIT_PAYLOAD_FILE=/app/init-payload.json
    volumes:
      # No top-level env_file: here on purpose — the app loads this file
      # itself via dotenv at startup (src/index.ts), non-fatally if it's
      # missing, so deploy methods that never populate .env (e.g. a
      # Portainer Git-repo stack, which has no way to get a gitignored
      # file into its clone) don't hard-fail the whole compose parse the
      # way `env_file:` does if the path doesn't exist. It's also written
      # to at runtime (Google OAuth refresh token persistence), so it
      # needs to be a real writable file, not baked into the image.
      #
      # The host-side source of each mount is parameterized below, defaulting
      # to paths relative to this file so `docker compose up` still works
      # out of the box for a plain git clone. For a Portainer Git-repo stack,
      # set the *_HOST_PATH/_HOST_DIR variables as stack environment
      # variables to real absolute paths on the host — relative paths there
      # resolve against Portainer's internal clone directory, not any actual
      # checkout on disk, which silently pointed these at empty/nonexistent
      # files in the past (Docker auto-creates a directory for a missing
      # bind-mount source rather than erroring). These variable names are
      # deliberately distinct from the SETTINGS_FILE/INIT_PAYLOAD_FILE
      # container env vars above — those control where *inside* the container
      # the app looks; these control where *on the host* the mount reads from.
      - ${ENV_HOST_PATH:-./.env}:/app/.env
      - ${INIT_PAYLOAD_HOST_PATH:-./init-payload.json}:/app/init-payload.json
      - ${DATA_HOST_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${PORT:-3333}/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
